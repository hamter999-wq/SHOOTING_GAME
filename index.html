<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Tactical Shooter</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600&display=swap');
        
        body {
            font-family: 'Teko', sans-serif;
            background-color: #0a0a0a;
            margin: 0;
            overflow: hidden;
            color: white;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #webcam {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror */
            z-index: 1;
            opacity: 0.6; /* ทำให้กล้องมืดลงนิดหน่อยเพื่อให้กราฟิกเกมเด่นขึ้น */
        }

        #output_canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .screen.active {
            display: flex;
        }

        .btn-menu {
            background: linear-gradient(45deg, #ef4444, #b91c1c);
            border: 2px solid #fca5a5;
            padding: 15px 40px;
            font-size: 2rem;
            color: white;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            margin: 10px;
            width: 300px;
            text-align: center;
        }
        
        .btn-menu:hover {
            transform: scale(1.05);
            background: linear-gradient(45deg, #f87171, #ef4444);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }

        .btn-menu:disabled {
            background: #525252;
            border-color: #737373;
            color: #a3a3a3;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #hud {
            display: none;
            padding: 20px;
            justify-content: space-between;
            width: 100%;
            pointer-events: none;
        }

        .hud-box {
            background: rgba(0,0,0,0.5);
            border-left: 4px solid #ef4444;
            padding: 10px 20px;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        #btn-back {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 40;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid white;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: none;
            pointer-events: auto;
        }

        #btn-back:hover { background: rgba(255,255,255,0.3); }

        .shake { animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-5px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-10px, 0, 0); }
            40%, 60% { transform: translate3d(10px, 0, 0); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>

        <div id="ui-layer">
            <div id="hud">
                <div class="hud-box">
                    AMMO: <span id="hud-ammo" class="text-red-400">0/10</span>
                </div>
                <div class="hud-box text-right">
                    STATUS: <span id="hud-status" class="text-yellow-400">EMPTY</span><br>
                    SCORE: <span id="hud-score" class="text-green-400">0</span>
                </div>
            </div>
        </div>

        <button id="btn-back" onclick="goToMenu()">BACK TO MENU</button>

        <!-- Main Menu Screen -->
        <div id="screen-menu" class="screen active">
            <h1 class="text-7xl mb-2 text-red-500 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]">AR TACTICAL</h1>
            <p class="text-2xl mb-8 text-gray-300 tracking-widest">SHOOTING RANGE</p>
            
            <div class="glass p-6 rounded-lg text-center mb-6 bg-black/50 border border-red-500/30 w-96">
                <h3 class="text-xl text-red-400 mb-2 border-b border-red-500/30 pb-2">WEAPON STATUS</h3>
                <p class="text-lg flex justify-between"><span>Mag Ammo:</span> <span id="menu-ammo" class="font-bold">0/10</span></p>
                <p class="text-lg flex justify-between"><span>Mag Inserted:</span> <span id="menu-inserted" class="font-bold text-red-400">NO</span></p>
                <p class="text-lg flex justify-between"><span>Chambered:</span> <span id="menu-chambered" class="font-bold text-red-400">NO</span></p>
            </div>

            <button class="btn-menu" onclick="startMode1()">1. LOAD AMMO</button>
            <button class="btn-menu" id="btn-mode2" onclick="startMode2()">2. RELOAD & CHAMBER</button>
            <button class="btn-menu" id="btn-mode3" onclick="startMode3()">3. SHOOTING RANGE</button>
            
            <p class="mt-8 text-lg text-gray-400">Controls: Use Pinch gesture (Thumb + Index) or Mouse click/drag</p>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const ctx = canvasElement.getContext('2d');
        const container = document.getElementById('game-container');

        let cw, ch;
        function resizeCanvas() {
            cw = window.innerWidth;
            ch = window.innerHeight;
            canvasElement.width = cw;
            canvasElement.height = ch;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Global Game States
        let currentMode = 'MENU'; // MENU, MODE1, MODE2, MODE3
        
        // Weapon States
        let weapon = {
            ammo: 0,
            maxAmmo: 10,
            isMagInserted: false,
            isChambered: false,
            score: 0
        };

        // Cursor & Interaction
        let cursor = { x: -100, y: -100, isPinching: false, justPinched: false, state: 'NORMAL' };
        let draggedObject = null;
        let handTrackingData = null;
        
        // Mouse Fallback
        let mouseX = 0, mouseY = 0, isMouseDown = false, justMouseDown = false;

        // Specific Mode Objects
        let mode1Objects = { bullets: [], magZone: null };
        let mode2Objects = { gun: null, mag: null, slide: null };
        let mode3Objects = { targets: [], crosshairScale: 1, recoilOffset: 0, flashOpacity: 0 };

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720
        });
        camera.start();

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handTrackingData = results.multiHandLandmarks[0];
                
                const indexTip = handTrackingData[8];
                const thumbTip = handTrackingData[4];

                // Mirror coordinates
                const ix = (1 - indexTip.x) * cw; const iy = indexTip.y * ch;
                const tx = (1 - thumbTip.x) * cw; const ty = thumbTip.y * ch;

                if (!isMouseDown) {
                    cursor.x = (ix + tx) / 2;
                    cursor.y = (iy + ty) / 2;
                }

                const distance = Math.hypot(ix - tx, iy - ty);
                const pinchThreshold = Math.min(cw, ch) * 0.06;
                const isPinchingNow = distance < pinchThreshold;

                handleInput(isPinchingNow);
            } else {
                handTrackingData = null;
            }
        }

        // Mouse Fallback Events
        window.addEventListener('mousemove', e => {
            mouseX = e.clientX; mouseY = e.clientY;
            if(!handTrackingData) { cursor.x = mouseX; cursor.y = mouseY; handleInput(isMouseDown); }
        });
        window.addEventListener('mousedown', e => {
            if(e.target.tagName === 'BUTTON') return; // ปล่อยให้ปุ่ม HTML ทำงาน
            isMouseDown = true;
            if(!handTrackingData) { cursor.x = mouseX; cursor.y = mouseY; handleInput(true); }
        });
        window.addEventListener('mouseup', () => {
            isMouseDown = false;
            if(!handTrackingData) handleInput(false);
        });

        function handleInput(isActionActive) {
            // Track rising edge for shooting/clicking
            cursor.justPinched = isActionActive && !cursor.isPinching;
            cursor.isPinching = isActionActive;

            if (currentMode === 'MODE1') updateMode1Logic();
            if (currentMode === 'MODE2') updateMode2Logic();
            if (currentMode === 'MODE3') updateMode3Logic();
        }

        function isInsideRect(px, py, rect) {
            return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
        }

        function updateMenuUI() {
            document.getElementById('menu-ammo').innerText = `${weapon.ammo}/${weapon.maxAmmo}`;
            
            const magText = document.getElementById('menu-inserted');
            magText.innerText = weapon.isMagInserted ? "YES" : "NO";
            magText.className = weapon.isMagInserted ? "font-bold text-green-400" : "font-bold text-red-400";
            
            const chamberText = document.getElementById('menu-chambered');
            chamberText.innerText = weapon.isChambered ? "YES" : "NO";
            chamberText.className = weapon.isChambered ? "font-bold text-green-400" : "font-bold text-red-400";

            // Disable buttons logic
            document.getElementById('btn-mode2').disabled = (weapon.ammo === 0 && !weapon.isMagInserted);
            document.getElementById('btn-mode3').disabled = !weapon.isChambered;
        }

        function updateHUD() {
            document.getElementById('hud-ammo').innerText = `${weapon.ammo}/${weapon.maxAmmo}`;
            document.getElementById('hud-score').innerText = weapon.score;
            let status = "READY";
            if(!weapon.isMagInserted) status = "INSERT MAG";
            else if(!weapon.isChambered) status = "PULL SLIDE";
            else if(weapon.ammo === 0) status = "EMPTY";
            
            const hudStatus = document.getElementById('hud-status');
            hudStatus.innerText = status;
            hudStatus.className = (status === "READY") ? "text-green-400" : "text-red-400";
        }

        function goToMenu() {
            currentMode = 'MENU';
            document.getElementById('screen-menu').classList.add('active');
            document.getElementById('hud').style.display = 'none';
            document.getElementById('btn-back').style.display = 'none';
            draggedObject = null;
            updateMenuUI();
        }

        function setupPlayMode() {
            document.getElementById('screen-menu').classList.remove('active');
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('btn-back').style.display = 'block';
            draggedObject = null;
            updateHUD();
        }

        function startMode1() {
            setupPlayMode();
            currentMode = 'MODE1';
            weapon.isMagInserted = false; // Reset insertion if reloading ammo
            weapon.isChambered = false;
            
            const mw = 120, mh = 250;
            mode1Objects.magZone = { x: cw/2 - mw/2, y: ch - mh - 50, w: mw, h: mh };
            spawnBullets();
        }

        function spawnBullets() {
            mode1Objects.bullets = [];
            let needed = weapon.maxAmmo - weapon.ammo;
            for(let i=0; i<needed; i++) {
                mode1Objects.bullets.push({
                    x: Math.random() * (cw - 100) + 50,
                    y: Math.random() * (ch/2) + 50,
                    w: 20, h: 60, isGrabbed: false
                });
            }
        }

        function updateMode1Logic() {
            let hovered = null;
            for (let b of mode1Objects.bullets) {
                if (isInsideRect(cursor.x, cursor.y, b)) { hovered = b; break; }
            }

            if (cursor.justPinched && hovered && !draggedObject) {
                draggedObject = hovered;
                draggedObject.isGrabbed = true;
            } else if (!cursor.isPinching && draggedObject) {
                // Drop
                if (isInsideRect(cursor.x, cursor.y, mode1Objects.magZone)) {
                    // Loaded
                    weapon.ammo++;
                    mode1Objects.bullets = mode1Objects.bullets.filter(b => b !== draggedObject);
                    updateHUD();
                }
                draggedObject.isGrabbed = false;
                draggedObject = null;
            }

            if (draggedObject) {
                draggedObject.x = cursor.x - draggedObject.w/2;
                draggedObject.y = cursor.y - draggedObject.h/2;
            }
        }

        function startMode2() {
            setupPlayMode();
            currentMode = 'MODE2';
            
            // Setup Gun Parts
            const gw = 400, gh = 250;
            mode2Objects.gun = { x: cw/2 - gw/2, y: ch/2 - gh/2, w: gw, h: gh };
            
            // Magazine entry point at bottom of gun handle
            const magW = 80, magH = 200;
            mode2Objects.mag = {
                x: weapon.isMagInserted ? mode2Objects.gun.x + 150 : 100,
                y: weapon.isMagInserted ? mode2Objects.gun.y + 100 : ch - 250,
                w: magW, h: magH,
                isInserted: weapon.isMagInserted
            };

            // Slide
            const slideW = 350, slideH = 60;
            mode2Objects.slide = {
                x: mode2Objects.gun.x + 25,
                y: mode2Objects.gun.y - 20,
                w: slideW, h: slideH,
                baseX: mode2Objects.gun.x + 25,
                isPulled: false
            };
        }

        function updateMode2Logic() {
            let hoveredMag = isInsideRect(cursor.x, cursor.y, mode2Objects.mag);
            let hoveredSlide = isInsideRect(cursor.x, cursor.y, mode2Objects.slide);

            if (cursor.justPinched && !draggedObject) {
                if (hoveredMag && !mode2Objects.mag.isInserted) {
                    draggedObject = { type: 'MAG', obj: mode2Objects.mag };
                } else if (hoveredSlide && weapon.isMagInserted && !weapon.isChambered) {
                    draggedObject = { type: 'SLIDE', obj: mode2Objects.slide };
                }
            } else if (!cursor.isPinching && draggedObject) {
                if (draggedObject.type === 'MAG') {
                    // Check if near gun handle
                    let targetX = mode2Objects.gun.x + 150;
                    let targetY = mode2Objects.gun.y + 100;
                    if (Math.abs(mode2Objects.mag.x - targetX) < 100 && Math.abs(mode2Objects.mag.y - targetY) < 100) {
                        mode2Objects.mag.x = targetX;
                        mode2Objects.mag.y = targetY;
                        mode2Objects.mag.isInserted = true;
                        weapon.isMagInserted = true;
                        updateHUD();
                    }
                } else if (draggedObject.type === 'SLIDE') {
                    // Check if pulled back enough (moving left)
                    if (mode2Objects.slide.baseX - mode2Objects.slide.x > 100) {
                        weapon.isChambered = true;
                        updateHUD();
                    }
                    // Snap back
                    mode2Objects.slide.x = mode2Objects.slide.baseX;
                }
                draggedObject = null;
            }

            if (draggedObject) {
                if (draggedObject.type === 'MAG') {
                    mode2Objects.mag.x = cursor.x - mode2Objects.mag.w/2;
                    mode2Objects.mag.y = cursor.y - mode2Objects.mag.h/2;
                } else if (draggedObject.type === 'SLIDE') {
                    // Constrain to X axis backwards
                    let newX = cursor.x - mode2Objects.slide.w/2;
                    newX = Math.min(mode2Objects.slide.baseX, Math.max(mode2Objects.slide.baseX - 150, newX));
                    mode2Objects.slide.x = newX;
                }
            }
        }

        function startMode3() {
            setupPlayMode();
            currentMode = 'MODE3';
            mode3Objects.targets = [];
            spawnTarget();
        }

        function spawnTarget() {
            if(currentMode !== 'MODE3') return;
            
            // Random depth scale to simulate 3D (0.5 to 1.5)
            let scale = Math.random() * 1 + 0.5; 
            let baseR = 40;
            mode3Objects.targets.push({
                x: Math.random() * (cw - 200) + 100,
                y: Math.random() * (ch - 300) + 100,
                r: baseR * scale,
                scale: scale,
                active: true,
                life: 100 // frames
            });

            setTimeout(spawnTarget, Math.random() * 2000 + 1000);
        }

        function shoot() {
            if (!weapon.isChambered || weapon.ammo <= 0) return;
            
            // Fire weapon
            weapon.ammo--;
            mode3Objects.recoilOffset = 20; // Visual recoil
            mode3Objects.flashOpacity = 1;
            
            // Check Hit
            for (let i = mode3Objects.targets.length - 1; i >= 0; i--) {
                let t = mode3Objects.targets[i];
                if (t.active) {
                    let dist = Math.hypot(cursor.x - t.x, cursor.y - t.y);
                    if (dist < t.r) {
                        t.active = false; // Hit!
                        weapon.score += Math.round(100 / t.scale); // Smaller = more points
                        break; // Pierce one target max
                    }
                }
            }

            if(weapon.ammo === 0) weapon.isChambered = false;
            updateHUD();
            
            // Screen shake
            container.classList.remove('shake');
            void container.offsetWidth; // trigger reflow
            container.classList.add('shake');
        }

        function updateMode3Logic() {
            if (cursor.justPinched) {
                shoot();
            }

            // Update targets life
            for (let i = mode3Objects.targets.length - 1; i >= 0; i--) {
                let t = mode3Objects.targets[i];
                t.life--;
                if (t.life <= 0 || !t.active) {
                    mode3Objects.targets.splice(i, 1);
                }
            }

            // Recoil recovery
            if(mode3Objects.recoilOffset > 0) mode3Objects.recoilOffset -= 2;
            if(mode3Objects.flashOpacity > 0) mode3Objects.flashOpacity -= 0.1;
        }

        function drawCursor() {
            if (cursor.x < 0) return;
            ctx.save();
            ctx.beginPath();
            if (currentMode === 'MODE3') {
                // Crosshair
                ctx.strokeStyle = weapon.isChambered ? (cursor.isPinching ? 'red' : '#0f0') : 'gray';
                ctx.lineWidth = 2;
                let size = 20 + mode3Objects.recoilOffset;
                ctx.moveTo(cursor.x - size, cursor.y); ctx.lineTo(cursor.x + size, cursor.y);
                ctx.moveTo(cursor.x, cursor.y - size); ctx.lineTo(cursor.x, cursor.y + size);
                ctx.arc(cursor.x, cursor.y, size/2, 0, Math.PI*2);
                ctx.stroke();
            } else {
                // Normal Cursor
                ctx.strokeStyle = cursor.isPinching ? '#22c55e' : '#3b82f6';
                if(draggedObject) ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 4;
                ctx.arc(cursor.x, cursor.y, 15, 0, Math.PI * 2);
                ctx.stroke();
                if(cursor.isPinching) {
                    ctx.fillStyle = ctx.strokeStyle;
                    ctx.fill();
                }
            }
            ctx.restore();
        }

        function drawMode1() {
            // Draw Magazine Zone
            ctx.fillStyle = 'rgba(50, 50, 50, 0.8)';
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.fillRect(mode1Objects.magZone.x, mode1Objects.magZone.y, mode1Objects.magZone.w, mode1Objects.magZone.h);
            ctx.strokeRect(mode1Objects.magZone.x, mode1Objects.magZone.y, mode1Objects.magZone.w, mode1Objects.magZone.h);
            
            ctx.fillStyle = 'white';
            ctx.font = '24px Teko';
            ctx.textAlign = 'center';
            ctx.fillText(`MAGAZINE: ${weapon.ammo}/10`, mode1Objects.magZone.x + mode1Objects.magZone.w/2, mode1Objects.magZone.y + mode1Objects.magZone.h/2);

            // Draw Bullets
            for(let b of mode1Objects.bullets) {
                ctx.fillStyle = '#fbbf24'; // Gold
                ctx.beginPath();
                ctx.rect(b.x, b.y + 10, b.w, b.h - 10);
                // Bullet tip
                ctx.moveTo(b.x, b.y + 10);
                ctx.lineTo(b.x + b.w/2, b.y);
                ctx.lineTo(b.x + b.w, b.y + 10);
                ctx.fill();
                ctx.stroke();
            }
        }

        function drawMode2() {
            // Draw Gun Body
            ctx.fillStyle = '#262626'; // Dark gray
            let g = mode2Objects.gun;
            ctx.fillRect(g.x, g.y, g.w, 60); // Top barrel area
            ctx.fillRect(g.x + 120, g.y + 60, 100, 150); // Grip
            
            // Draw Mag
            let m = mode2Objects.mag;
            ctx.fillStyle = '#404040';
            ctx.fillRect(m.x, m.y, m.w, m.h);
            // Bullets in mag visual
            if(!m.isInserted) {
                ctx.fillStyle = '#fbbf24';
                for(let i=0; i<weapon.ammo; i++) {
                    ctx.fillRect(m.x + 10, m.y + 10 + (i*15), m.w - 20, 10);
                }
            }

            // Draw Slide
            let s = mode2Objects.slide;
            ctx.fillStyle = s.x < s.baseX - 50 ? '#525252' : '#737373'; // Highlight when pulled
            ctx.fillRect(s.x, s.y, s.w, s.h);
            ctx.strokeStyle = '#171717';
            // Slide grip grooves
            for(let i=0; i<5; i++) {
                ctx.strokeRect(s.x + s.w - 40 - (i*15), s.y + 10, 5, 40);
            }
        }

        function drawMode3() {
            // Draw Targets
            for(let t of mode3Objects.targets) {
                ctx.save();
                ctx.translate(t.x, t.y);
                
                // Opacity based on life
                ctx.globalAlpha = t.life / 100;

                // Red/White concentric circles
                ctx.beginPath(); ctx.arc(0, 0, t.r, 0, Math.PI*2); ctx.fillStyle = 'red'; ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, t.r * 0.7, 0, Math.PI*2); ctx.fillStyle = 'white'; ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, t.r * 0.4, 0, Math.PI*2); ctx.fillStyle = 'red'; ctx.fill();
                
                ctx.restore();
            }

            // Muzzle Flash
            if(mode3Objects.flashOpacity > 0) {
                ctx.fillStyle = `rgba(255, 255, 100, ${mode3Objects.flashOpacity})`;
                ctx.fillRect(0, 0, cw, ch);
            }
        }

        function drawLoop() {
            ctx.clearRect(0, 0, cw, ch);

            if (currentMode === 'MODE1') drawMode1();
            if (currentMode === 'MODE2') drawMode2();
            if (currentMode === 'MODE3') drawMode3();

            // Draw Hand Skeleton
            if (handTrackingData && currentMode !== 'MENU') {
                ctx.save();
                ctx.strokeStyle = 'rgba(0, 255, 0, 0.3)';
                ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(0, 255, 0, 0.5)';
                for(let lm of handTrackingData) {
                    let lx = (1 - lm.x) * cw; // Mirrored
                    let ly = lm.y * ch;
                    ctx.beginPath(); ctx.arc(lx, ly, 3, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            }

            drawCursor();
            requestAnimationFrame(drawLoop);
        }

        requestAnimationFrame(drawLoop);

    </script>
</body>
</html>
